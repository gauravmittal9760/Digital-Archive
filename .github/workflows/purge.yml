# Runs every 6 hours: permanently deletes trash older than 30 days, retries failed AI jobs, sends expiry reminders
# and finishes pending file deletions - even if nobody logs in.
#
# One-time setup (GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret):
#   SITE_URL     = https://your-service.onrender.com      (no trailing slash)
#   CRON_SECRET  = any long random text; the SAME value must be set as CRON_SECRET in Render -> Environment
# Note: this does NOT keep a free Render service awake (6 h is too long); use UptimeRobot on /health for that.
name: purge-trash
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Call /cron/purge
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing secret. Add SITE_URL and CRON_SECRET under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # A sleeping free Render service needs up to ~60 s to wake, so allow time and retry.
          code=$(curl -sS -o /tmp/out.txt -w "%{http_code}" --max-time 150 --retry 4 --retry-delay 30 --retry-all-errors \
                 -H "X-Cron-Key: $CRON_SECRET" "${SITE_URL%/}/cron/purge" || echo "000")
          echo "HTTP $code"; cat /tmp/out.txt 2>/dev/null; echo
          case "$code" in
            200) echo "Purge OK" ;;
            404) echo "::error::404 - CRON_SECRET in Render is missing or different from the GitHub secret."; exit 1 ;;
            000) echo "::error::Could not reach SITE_URL. Check the address and that the Render service is deployed."; exit 1 ;;
            *)   echo "::error::Unexpected response $code"; exit 1 ;;
          esac
