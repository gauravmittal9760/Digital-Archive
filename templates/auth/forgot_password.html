{% extends 'auth/_layout.html' %}
{% block title %}Forgot password{% endblock %}
{% block auth_back %}{{ ui.back(url_for('auth.forgot')) }}{% endblock %}
{% block auth_body %}
<h1>Reset your password</h1><p>Start with your username.</p>
<form method="post" class="card">{{ ui.csrf() }}
  <label class="field"><span>Username</span><input name="username" autocapitalize="none" required autofocus></label>
  <button class="btn block" type="submit">Continue {{ ui.icon('chevron-right') }}</button>
  <div class="auth-links"><a href="{{ url_for('auth.forgot_username') }}">Forgot username?</a></div>
</form>
{% endblock %}
