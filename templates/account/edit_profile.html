{% extends 'base.html' %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<div class="page-head"><div class="titles"><h1>Edit profile</h1></div></div>
<div class="grid g2" style="max-width:900px">
<form method="post" action="{{ url_for('account.upload_avatar') }}" enctype="multipart/form-data" class="card">{{ ui.csrf() }}<h3 class="mb">Profile picture</h3>
  {% if avatar %}<img class="avatar lg" src="{{ avatar }}" alt="">{% else %}<span class="avatar lg">{{ current_user.username[:1]|upper }}</span>{% endif %}
  <label class="field mt"><span>Choose picture</span><input type="file" name="avatar" accept="image/*" required></label><button class="btn sm">{{ ui.icon('upload') }}Upload</button></form>
<form method="post" class="card">{{ ui.csrf() }}<h3 class="mb">Details</h3>
  <label class="field"><span>Username</span><input name="username" value="{{ current_user.username }}" required></label>
  <label class="field"><span>Display name</span><input name="display_name" value="{{ current_user.display_name or '' }}" maxlength="100"></label>
  <label class="field"><span>Bio</span><textarea name="bio" maxlength="300">{{ current_user.bio or '' }}</textarea></label><button class="btn">{{ ui.icon('check') }}Save</button></form>
</div>
{% endblock %}
