{% extends 'base_admin.html' %}
{% block title %}New password{% endblock %}
{% block body %}<div class="gate"><div class="box"><div class="vault">{{ ui.icon('key') }}</div><h1>New admin password</h1><p class="sub">Choose a strong password.</p>
  <form method="post">{{ ui.csrf() }}<label class="field"><span>New password</span><input type="password" name="new_password" autocomplete="new-password" required></label><label class="field"><span>Confirm</span><input type="password" name="confirm_password" autocomplete="new-password" required></label><button class="btn block">{{ ui.icon('check') }}Save password</button></form></div></div>{% endblock %}
